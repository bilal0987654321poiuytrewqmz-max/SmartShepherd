
name: Smart Shepherd - Build And Emulator Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: BUILD AND UNIT TESTS
  # ==========================================

  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Project Structure
        shell: bash
        run: |
          echo "Checking project files..."

          test -d app
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          echo "Project structure is valid."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Show Build Environment
        run: |
          java -version
          gradle --version
          adb version

      - name: Run Unit Tests
        run: |
          gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartShepherd-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartShepherd-Build-Reports
          path: |
            **/build/reports/tests/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # JOB 2: ANDROID EMULATOR TEST
  # ==========================================

  emulator-test:
    name: Install And Run On Android Emulator
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: SmartShepherd-Debug-APK
          path: artifacts

      - name: Start Android Emulator And Test App
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: |
            set -e

            echo "================================"
            echo "ANDROID EMULATOR TEST"
            echo "================================"

            APK="artifacts/app-debug.apk"

            if [ ! -f "$APK" ]; then
              echo "ERROR: APK file not found."
              exit 1
            fi

            echo "APK found."

            echo "Searching for AAPT..."

            AAPT=$(find "$ANDROID_HOME/build-tools" \
              -type f -name aapt | sort -V | tail -n 1)

            if [ -z "$AAPT" ]; then
              echo "ERROR: AAPT not found."
              exit 1
            fi

            PACKAGE_NAME=$("$AAPT" dump badging "$APK" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p")

            if [ -z "$PACKAGE_NAME" ]; then
              echo "ERROR: Could not detect application ID."
              exit 1
            fi

            echo "Application ID: $PACKAGE_NAME"

            echo "================================"
            echo "INSTALLING APPLICATION"
            echo "================================"

            adb install -r "$APK"

            echo "Installation successful."

            echo "================================"
            echo "LAUNCHING APPLICATION"
            echo "================================"

            adb shell monkey -p "$PACKAGE_NAME" \
              -c android.intent.category.LAUNCHER 1

            sleep 15

            echo "================================"
            echo "CHECKING APPLICATION PROCESS"
            echo "================================"

            APP_PID=$(adb shell pidof -s "$PACKAGE_NAME" | tr -d '\r')

            if [ -z "$APP_PID" ]; then
              echo "ERROR: Application process is not running."
              adb logcat -d -t 500 > emulator-logcat.txt
              exit 1
            fi

            echo "Application is running."
            echo "PID: $APP_PID"

            echo "================================"
            echo "CHECKING FATAL EXCEPTIONS"
            echo "================================"

            adb logcat -d --pid="$APP_PID" > app-logcat.txt

            if grep -q "FATAL EXCEPTION" app-logcat.txt; then
              echo "ERROR: Fatal exception detected."
              cat app-logcat.txt
              exit 1
            fi

            echo "No fatal exception detected."

            echo "================================"
            echo "EMULATOR TEST PASSED"
            echo "================================"

            adb shell dumpsys activity activities \
              > emulator-activities.txt

      - name: Upload Emulator Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartShepherd-Emulator-Logs
          path: |
            app-logcat.txt
            emulator-logcat.txt
            emulator-activities.txt
          if-no-files-found: ignore
          retention-days: 7
