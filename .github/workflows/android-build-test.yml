name: Smart Shepherd - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build SmartShepherd APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Project
        shell: bash
        run: |
          set -e

          echo "===== Project ====="
          pwd
          ls -la

          test -d app
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle

          echo "===== Detector Model ====="
          test -f app/src/main/assets/models/sheep_detector.tflite

          ls -lh app/src/main/assets/models/sheep_detector.tflite

      - name: Run Unit Tests
        run: |
          gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

          echo "APK path:"
          echo "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartShepherd-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartShepherd-Build-Reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
