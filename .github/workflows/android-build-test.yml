name: Smart Shepherd - Replace Project And Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# نحتاج الكتابة على الملفات ودفع التغييرات إلى main.
# workflows: write مهم لأن المشروع الجديد قد يحتوي
# على ملفات داخل .github/workflows/
permissions:
  contents: write
  workflows: write

jobs:

  replace-project:
    name: Replace Old Project With SmartShepherd-AI-v0.3
    runs-on: ubuntu-24.04

    # لا نعدل المستودع من Pull Request.
    if: github.event_name != 'pull_request'

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Check ZIP
        run: |
          set -e

          ZIP="SmartShepherd-AI-v0.3.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in repository root."
            exit 1
          fi

          echo "================================"
          echo "ZIP FOUND"
          echo "================================"

          ls -lh "$ZIP"

      - name: Extract New Project
        run: |
          set -e

          ZIP="SmartShepherd-AI-v0.3.zip"
          TEMP_DIR="$RUNNER_TEMP/smart_shepherd_new"

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          unzip -q "$ZIP" -d "$TEMP_DIR"

          echo "================================"
          echo "EXTRACTED ZIP CONTENTS"
          echo "================================"

          find "$TEMP_DIR" \
            -maxdepth 3 \
            -type f \
            | sort

      - name: Detect Project Root
        run: |
          set -e

          TEMP_DIR="$RUNNER_TEMP/smart_shepherd_new"

          # الحالة الأولى:
          # ZIP يحتوي مجلد SmartShepherd-AI-v0.3
          if [ -d "$TEMP_DIR/SmartShepherd-AI-v0.3" ]; then

            PROJECT_ROOT="$TEMP_DIR/SmartShepherd-AI-v0.3"

          # الحالة الثانية:
          # ZIP يحتوي app مباشرة
          elif [ -d "$TEMP_DIR/app" ]; then

            PROJECT_ROOT="$TEMP_DIR"

          else

            echo "ERROR: Could not detect Android project root."

            find "$TEMP_DIR" \
              -maxdepth 3 \
              -type d \
              | sort

            exit 1

          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "================================"
          echo "PROJECT ROOT"
          echo "================================"

          echo "$PROJECT_ROOT"

      - name: Verify New Project
        run: |
          set -e

          echo "================================"
          echo "VERIFYING NEW PROJECT"
          echo "================================"

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/settings.gradle" ] &&
             [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/build.gradle" ] &&
             [ ! -f "$PROJECT_ROOT/build.gradle.kts" ]; then
            echo "ERROR: root Gradle build file not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/app/src/main/assets/models/sheep_detector.tflite" ]; then
            echo "ERROR: bundled sheep detector model not found."
            exit 1
          fi

          echo ""
          echo "New Android project verified."

          echo ""
          echo "Detector model:"

          ls -lh \
            "$PROJECT_ROOT/app/src/main/assets/models/sheep_detector.tflite"

      - name: Remove Old Project Files
        run: |
          set -e

          echo "================================"
          echo "REMOVING OLD PROJECT FILES"
          echo "================================"

          # مهم جداً:
          #
          # لا نحذف:
          # .git
          #
          # لأن .git يحتوي تاريخ المستودع
          # وبيانات GitHub.
          #
          # كذلك لا نحذف ZIP الآن لأنه مصدر المشروع الجديد.

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name "SmartShepherd-AI-v0.3.zip" \
            -exec rm -rf {} +

          echo ""
          echo "Old project files removed."

          echo ""
          echo "Git directory preserved."

      - name: Copy New Project Into Repository
        run: |
          set -e

          echo "================================"
          echo "COPYING NEW PROJECT"
          echo "================================"

          # نسخ كل محتويات المشروع الجديد
          # بما فيها .github/workflows إذا كانت موجودة.
          #
          # هذا يعني أن ملفات المشروع القديمة التي تم حذفها
          # ستختفي، والملفات الجديدة ستصبح هي الموجودة.

          cp -a "$PROJECT_ROOT"/. .

          echo ""
          echo "New project copied successfully."

      - name: Remove Replacement ZIP
        run: |
          set -e

          # الـ ZIP كان مجرد وسيلة لنقل المشروع.
          # لا نريده داخل المشروع النهائي.
          rm -f "SmartShepherd-AI-v0.3.zip"

          echo "Replacement ZIP removed from repository."

      - name: Verify Final Repository
        run: |
          set -e

          echo "================================"
          echo "FINAL PROJECT CHECK"
          echo "================================"

          if [ ! -d "app" ]; then
            echo "ERROR: Final app directory is missing."
            exit 1
          fi

          if [ ! -f "app/src/main/assets/models/sheep_detector.tflite" ]; then
            echo "ERROR: Final detector model is missing."
            exit 1
          fi

          echo ""
          echo "Final detector model:"

          ls -lh \
            "app/src/main/assets/models/sheep_detector.tflite"

          echo ""
          echo "================================"
          echo "FINAL GIT STATUS"
          echo "================================"

          git status --short

      - name: Commit And Push New Project
        run: |
          set -e

          echo "================================"
          echo "COMMIT AND PUSH"
          echo "================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # يضيف كل التغييرات:
          # الملفات الجديدة
          # الملفات المعدلة
          # الملفات المحذوفة
          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          echo ""
          echo "Changes to be committed:"

          git diff --cached --stat

          git commit \
            -m "Replace project with SmartShepherd-AI-v0.3"

          git push origin HEAD:main

          echo ""
          echo "================================"
          echo "PROJECT REPLACED SUCCESSFULLY"
          echo "================================"

  build-and-test:
    name: Build And Test On Emulator
    runs-on: ubuntu-24.04

    needs: replace-project

    if: |
      always() &&
      (
        github.event_name == 'pull_request' ||
        needs.replace-project.result == 'success'
      )

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Verify Bundled Detector Model
        run: |
          set -e

          MODEL="app/src/main/assets/models/sheep_detector.tflite"

          if [ ! -f "$MODEL" ]; then
            echo "ERROR: Detector model is missing."
            exit 1
          fi

          echo "Detector model:"
          ls -lh "$MODEL"

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK For Emulator
        run: gradle assembleDebug --stacktrace

      - name: Start Emulator And Test App
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2

          cores: 2
          ram-size: 3072M
          heap-size: 512M

          emulator-boot-timeout: 600
          disable-animations: true
          disable-linux-hw-accel: auto

          script: |
            set -e

            echo "================================"
            echo "SMART SHEPHERD EMULATOR TEST"
            echo "================================"

            APK="app/build/outputs/apk/debug/app-debug.apk"

            if [ ! -f "$APK" ]; then
              echo "ERROR: APK was not generated."
              exit 1
            fi

            echo "APK ready for testing."

            echo "Waiting for Android device..."
            adb wait-for-device

            echo "Waiting for Android boot..."

            timeout 180 bash -c '
              until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ];
              do
                sleep 3
              done
            '

            echo "Android boot completed."

            echo "================================"
            echo "INSTALLING APPLICATION"
            echo "================================"

            adb install -r "$APK"

            echo "Installation successful."

            echo "================================"
            echo "DETECTING APPLICATION ID"
            echo "================================"

            AAPT=$(find "$ANDROID_HOME/build-tools" \
              -type f -name aapt \
              | sort -V \
              | tail -n 1)

            if [ -z "$AAPT" ]; then
              echo "ERROR: AAPT not found."
              exit 1
            fi

            PACKAGE_NAME=$("$AAPT" dump badging "$APK" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p")

            if [ -z "$PACKAGE_NAME" ]; then
              echo "ERROR: Could not detect application ID."
              exit 1
            fi

            echo "Application ID: $PACKAGE_NAME"

            echo "================================"
            echo "LAUNCHING APPLICATION"
            echo "================================"

            adb shell monkey \
              -p "$PACKAGE_NAME" \
              -c android.intent.category.LAUNCHER 1

            sleep 10

            echo "================================"
            echo "CHECKING APPLICATION PROCESS"
            echo "================================"

            APP_PID=$(adb shell pidof -s "$PACKAGE_NAME" \
              | tr -d '\r')

            if [ -z "$APP_PID" ]; then

              echo "ERROR: Application process is not running."

              adb logcat -d -t 2000 \
                > emulator-logcat.txt

              exit 1
            fi

            echo "Application is running."
            echo "PID: $APP_PID"

            echo "================================"
            echo "CHECKING FATAL EXCEPTIONS"
            echo "================================"

            adb logcat -d > full-logcat.txt

            if grep -q "FATAL EXCEPTION" full-logcat.txt; then

              echo "ERROR: Fatal exception detected."

              grep -A 80 -B 10 \
                "FATAL EXCEPTION" \
                full-logcat.txt

              exit 1
            fi

            echo "No fatal exception detected."

            echo "================================"
            echo "CHECKING APPLICATION ACTIVITY"
            echo "================================"

            adb shell dumpsys activity activities \
              > emulator-activities.txt

            echo "================================"
            echo "EMULATOR TEST PASSED"
            echo "================================"

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartShepherd-Emulator-Test-Logs
          path: |
            full-logcat.txt
            emulator-logcat.txt
            emulator-activities.txt
          if-no-files-found: ignore
          retention-days: 7
