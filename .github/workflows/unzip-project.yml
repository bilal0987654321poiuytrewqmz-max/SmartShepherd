
name: Extract Smart Shepherd To Repository Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/shepherd_extract
          unzip -o "$ZIP_FILE" -d /tmp/shepherd_extract

      - name: Find project root
        run: |
          PROJECT_ROOT=$(find /tmp/shepherd_extract \
            -type f -name "settings.gradle.kts" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Copy project files
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

          rsync -av "$PROJECT_ROOT/" ./ \
            --exclude='.git/' \
            --exclude='.github/workflows/unzip-project.yml' \
            --exclude='.github/workflows/android.yml'

      - name: Verify project
        run: |
          test -d app
          test -f settings.gradle.kts
          echo "Project successfully extracted to root!"

      - name: Remove old extracted folder
        run: |
          rm -rf extracted

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Install Smart Shepherd Phase 2 in repository root" || echo "No changes"
          git push
