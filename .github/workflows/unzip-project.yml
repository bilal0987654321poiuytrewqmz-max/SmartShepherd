name: Smart Shepherd - Build And Emulator Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smart-shepherd-build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build APK And Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Android Project
        run: |
          echo "===== PROJECT STRUCTURE ====="

          test -d app
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle

          echo "Project structure verified."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Gradle
        run: |
          gradle --version

      - name: Android Unit Tests
        run: |
          gradle testDebugUnitTest

      - name: Build Debug APK
        run: |
          gradle assembleDebug

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND!"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "===== APK INFORMATION ====="
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartShepherd-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartShepherd-Build-Reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  emulator-test:
    name: Install And Test On Android Emulator
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK For Emulator
        run: |
          gradle assembleDebug

      - name: Start Android Emulator And Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: |
            set -e

            echo "===== WAIT FOR ANDROID ====="
            adb wait-for-device

            adb shell getprop sys.boot_completed

            echo "===== INSTALL APK ====="
            APK=$(find app/build/outputs/apk/debug \
              -type f -name "*.apk" | head -n 1)

            test -n "$APK"
            adb install -r "$APK"

            echo "===== FIND APPLICATION ID ====="
            APP_ID=$(grep -m1 'applicationId' app/build.gradle.kts \
              | sed -E 's/.*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

            if [ -z "$APP_ID" ]; then
              echo "Could not read applicationId."
              exit 1
            fi

            echo "Application ID: $APP_ID"

            echo "===== LAUNCH APPLICATION ====="
            adb shell monkey -p "$APP_ID" \
              -c android.intent.category.LAUNCHER 1

            sleep 15

            echo "===== CHECK APPLICATION PROCESS ====="
            adb shell pidof "$APP_ID"

            echo "===== CHECK CRASH LOGS ====="
            adb logcat -d -t 5000 > emulator-logcat.txt

            if grep -E \
              "FATAL EXCEPTION|Fatal signal|Process .* has died" \
              emulator-logcat.txt; then
              echo "APPLICATION CRASH DETECTED"
              exit 1
            fi

            echo "APPLICATION LAUNCH TEST PASSED"

      - name: Upload Emulator Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartShepherd-Emulator-Logs
          path: emulator-logcat.txt
          if-no-files-found: ignore
