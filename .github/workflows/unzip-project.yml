
name: Extract Smart Shepherd Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Find ZIP file
        run: |
          ZIP_FILE=$(find source -maxdepth 1 -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in source/"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Show extracted files
        run: |
          find extracted -maxdepth 4 -type f | sort

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add extracted
          git commit -m "Extract Smart Shepherd Phase 2 project" || echo "No changes"
          git push
